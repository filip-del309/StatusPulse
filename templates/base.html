<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        StatusPulse
        {% endblock %}
    </title>

    <style>
        body {
            margin: 0;
            background: #f5f7fa;
            color: #1f2937;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 32px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card a {
            color: #2563eb;
            text-decoration: none;
        }

        .card a:hover {
            text-decoration: underline;
        }

        code {
            background: #f1f5f9;
            border-radius: 6px;
            padding: 3px 7px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-new {
            background: #fef3c7;
            color: #92400e;
        }

        .status-update {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-ok {
            background: #dcfce7;
            color: #166534;
        }

        section {
            margin-top: 30px;
        }

        .change {
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .change:last-child {
            border-bottom: none;
        }

        footer {
            text-align: center;
            color: #6b7280;
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <a href="/status/artifacthub">
        <strong>StatusPulse</strong>
    </a>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    StatusPulse
</footer>

</body>
</html>
