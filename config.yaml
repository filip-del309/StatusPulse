      - name: litellm/litellm-helm
        folders:
          - litellm
      - name: grafana-community/loki
        folders:
          - loki
      - name: longhorn/longhorn
        folders:
          - longhorn
      - name: metrics-server/metrics-server
        folders:
          - metrics-server
      - name: nextcloud/nextcloud
        folders:
          - nextcloud
      - name: oauth2-proxy/oauth2-proxy
        folders:
